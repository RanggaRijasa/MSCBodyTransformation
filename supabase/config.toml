verify_jwt = false
entrypoint = "./functions/commerce-apple-notifications/index.ts"

[functions.apple-identity-lifecycle]
enabled = true
verify_jwt = false
entrypoint = "./functions/apple-identity-lifecycle/index.ts"

[functions.apple-account-events]
enabled = true
verify_jwt = false
entrypoint = "./functions/apple-account-events/index.ts"

[functions.apple-identity-reconciliation]
