<!doctype html>
<html lang="id-ID">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d92d20" />
    <meta name="robots" content="noindex" />
    <title>MSC sedang offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(34rem, calc(100% - 2rem));
      }
      p {
        line-height: 1.6;
        color: color-mix(in srgb, CanvasText 72%, transparent);
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 1rem;
        border-radius: 0.75rem;
        background: #d92d20;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>MSC Body Transformation</p>
      <h1>Kamu sedang offline</h1>
      <p>
        Halaman pribadi tidak disimpan di perangkat. Sambungkan internet, lalu muat ulang untuk
        melanjutkan. Aktivitas dan pembayaran belum dianggap berhasil sebelum tersimpan di server.
      </p>
      <a href="/">Coba muat ulang</a>
    </main>
  </body>
</html>
