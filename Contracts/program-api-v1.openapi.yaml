openapi: 3.1.0
info:
  title: MSC Body Transformation Program API
  version: 1.0.0
  description: >
    Platform-neutral contract shared by iOS and the future Android client.
    Dates are ISO-8601, identifiers are UUIDs, weights and prices are JSON
    decimal strings, and enum raw values are stable.
servers:
  - url: https://{project}.supabase.co/functions/v1
    variables:
      project:
        default: production-project
  - url: http://127.0.0.1:54321/functions/v1
    description: Supabase lokal untuk development dan pengujian.
security:
  - bearerAuth: []
x-phase-09-5-handoff:
  status: local-ui-contract-only
  notes:
    - Guest is logged out and must not create an anonymous user.
    - Self-registration creates Participant; Coach is a separate application.
    - Member level, eligibility, payment, approval, role, and entitlement are separate authoritative states.
    - Backend paths and schemas are added with Phase 10-12 migrations and RLS, not by the Phase 09.5 mock.
paths:
  /delete-account:
    post:
      operationId: deleteCurrentAccount
      x-implementation-status: implemented-phase10
      description: >
        Permanently deletes the recently reauthenticated Participant or
        relationship-free Coach account. Private Storage objects are removed
        first; financial and audit records are retained without the account
        identity. Admin self-deletion and Coach deletion with assigned
        participants are rejected.
      responses:
        "204":
          description: Account data and Auth identity were deleted.
        "401":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"
  /programs:
    get:
      operationId: listPublicPrograms
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      security:
        - publishableKey: []
      responses:
        "200":
          description: >
            Published-lifecycle programs visible to a logged-out Guest.
            Creator identity and quiz answer keys are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
  /coaches:
    get:
      operationId: listPublicCoaches
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      security:
        - publishableKey: []
      responses:
        "200":
          description: >
            Approved, explicitly public Coaches without contact information,
            Auth identity, or enrollment QR identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCoach"
  /programs/{programId}/leaderboard:
    get:
      operationId: listPublicLeaderboard
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      security:
        - publishableKey: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: >
            Public score totals. Body weight, enrollment identifiers, and
            score component breakdown are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicLeaderboardEntry"
  /programs/{programId}/winners:
    get:
      operationId: listPublicWinners
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      security:
        - publishableKey: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Public rows from an immutable locked winner snapshot.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: "#/components/schemas/PublicWinner"
  /winner-posters:
    get:
      operationId: listPublicWinnerPosters
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      security:
        - publishableKey: []
      responses:
        "200":
          description: Published winner posters only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicWinnerPoster"
  /me/profile:
    get:
      operationId: getCurrentProfile
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: >
            Current authenticated account and onboarding state. The caller is
            always filtered by the JWT subject in addition to RLS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedProfile"
        "401":
          $ref: "#/components/responses/DomainError"
  /me/enrollments:
    get:
      operationId: listCurrentParticipantEnrollments
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: Enrollments owned by the authenticated Participant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
  /me/assigned-coach:
    get:
      operationId: getCurrentAssignedCoach
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: >
            Narrow assigned-Coach projection. Phone number and raw Coach QR
            identifier are never returned.
          content:
            application/json:
              schema:
                type: [object, "null"]
                oneOf:
                  - $ref: "#/components/schemas/AssignedCoach"
  /me/program-day-access:
    get:
      operationId: listCurrentProgramDayAccess
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: Server-resolved access state for the caller enrollments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramDayAccess"
  /me/dashboard-summary:
    get:
      operationId: getCurrentDashboardSummary
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: Role-specific counts derived from rows visible to caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedDashboardSummary"
  /me/enrollments/{enrollmentId}/submissions:
    get:
      operationId: listCurrentParticipantSubmissions
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Own submission history, answers, and quiz results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StepSubmission"
  /me/enrollments/{enrollmentId}/weigh-ins:
    get:
      operationId: listCurrentParticipantWeighIns
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Own private weigh-in history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeighIn"
  /me/enrollments/{enrollmentId}/score:
    get:
      operationId: getCurrentParticipantScore
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Own authoritative score breakdown for one enrollment.
          content:
            application/json:
              schema:
                type: [object, "null"]
                oneOf:
                  - $ref: "#/components/schemas/PrivateScore"
  /programs/{programId}/duplicate:
    post:
      operationId: duplicateProgram
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateProgramRequest"
      responses:
        "201":
          description: Independent draft with new nested identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /programs/{programId}/publish:
    post:
      operationId: publishProgram
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Published immutable program.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "409":
          $ref: "#/components/responses/DomainError"
  /programs/{programId}/enroll/free:
    post:
      operationId: enrollFreeProgram
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coachQrPayload]
              properties:
                coachQrPayload:
                  type: string
      responses:
        "200":
          description: Existing or newly-created enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "409":
          $ref: "#/components/responses/DomainError"
  /admin/programs/{programId}/enrollments:
    post:
      operationId: adminEnrollParticipant
      x-implementation-status: implemented-phase11
      description: >
        Admin-only operation. It may bypass an elapsed registration cutoff,
        but still enforces program lifecycle, capacity, approved Coach, and
        verified payment for a paid program.
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, reason]
              properties:
                participantId: { type: string, format: uuid }
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Existing or newly-created audited enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"
  /me/coach-application:
    get:
      operationId: getCurrentCoachApplication
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: Current applicant-owned aggregate.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CoachApplication"
                  - type: "null"
    put:
      operationId: saveCurrentCoachApplicationDraft
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachApplicationDraftInput"
      responses:
        "200":
          description: Idempotently saved applicant-owned draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachApplication"
  /me/coach-application/{applicationId}/submit:
    post:
      operationId: submitCurrentCoachApplication
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Submitted application; payment remains a Phase 12 handoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachApplication"
  /admin/coach-applications:
    get:
      operationId: listCoachApplicationsForAdmin
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: Admin-only aggregates with server-computed eligibility and payment state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachApplication"
  /admin/coach-applications/{applicationId}/decision:
    post:
      operationId: decideCoachApplication
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: [string, "null"] }
      responses:
        "200":
          description: Atomic, idempotent, audited terminal decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachApplication"
        "409":
          $ref: "#/components/responses/DomainError"
  /coach/participants:
    get:
      operationId: listAssignedCoachParticipants
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: Active-entitled Coach roster projection.
  /coach/submissions/pending:
    get:
      operationId: listAssignedPendingReviews
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      responses:
        "200":
          description: Pending submissions for participants assigned to the caller.
  /admin/scores/{entryId}/adjust:
    post:
      operationId: adjustEnrollmentScore
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [points, reason]
              properties:
                points: { type: integer, not: { const: 0 } }
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Server-reconciled authoritative score.
  /programs/{programId}/complete:
    post:
      operationId: completeProgram
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Completed program after pending-review validation.
  /admin/private-media/orphans/cleanup:
    post:
      operationId: cleanupOrphanQuestionPhotos
      x-implementation-status: implemented-phase11
      x-phase11-status: implemented-local-edge-function
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                olderThanHours: { type: integer, minimum: 1, default: 24 }
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Storage API cleanup count; deleted object names are not returned.
  /commerce/programs/{programId}/preflight:
    post:
      operationId: createProgramPurchaseIntent
      x-implementation-status: new-phase12-local
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Opaque server-owned purchase intent and StoreKit inputs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseIntentPreflight"
        "409":
          $ref: "#/components/responses/DomainError"
  /commerce/coach-access/preflight:
    post:
      operationId: createCoachAccessPurchaseIntent
      x-implementation-status: new-phase12-local
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Coach product mapping after protected Admin acceptance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseIntentPreflight"
  /commerce/intents/{purchaseIntentId}/pending:
    post:
      operationId: markPurchaseIntentPending
      x-implementation-status: new-phase12-local
      parameters:
        - name: purchaseIntentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reservation extended while the StoreKit sheet is active.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [purchaseIntentId, status, expiresAt]
                properties:
                  purchaseIntentId: { type: string, format: uuid }
                  status: { type: string, enum: [purchase_pending] }
                  expiresAt: { type: string, format: date-time }
  /commerce/apple/verify:
    post:
      operationId: verifyApplePurchase
      x-implementation-status: new-phase12-local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplePurchaseVerificationRequest"
      responses:
        "200":
          description: Durable idempotent server-authoritative fulfillment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommerceFulfillment"
        "401":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"
  /commerce/history:
    get:
      operationId: listMyCommerceHistory
      x-implementation-status: new-phase12-local
      responses:
        "200":
          description: Private read-only transaction and entitlement history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommerceTransaction"
  /commerce/apple/restore:
    post:
      operationId: reconcileApplePurchases
      x-implementation-status: new-phase12-local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleRestoreRequest"
      responses:
        "200":
          description: Server results for current or unfinished StoreKit transactions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [fulfillments]
                properties:
                  fulfillments:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommerceFulfillment"
  /commerce-apple-notifications:
    post:
      operationId: receiveAppleServerNotificationV2
      x-implementation-status: new-phase12-local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signedPayload]
              properties:
                signedPayload: { type: string, minLength: 1, writeOnly: true }
      responses:
        "202":
          description: Verified notification was durably accepted or was a duplicate.
  /commerce/google/verify:
    post:
      operationId: verifyGooglePurchase
      x-implementation-status: deferred-phase14
      description: >
        Contract placeholder for Android. The purchase intent is server-owned;
        no raw Coach QR, account ID, role, price, or entitlement is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purchaseIntentId, purchaseToken]
              properties:
                purchaseIntentId: { type: string, format: uuid }
                purchaseToken: { type: string, minLength: 1, writeOnly: true }
      responses:
        "501":
          description: Deferred until Phase 14 Play Billing implementation.
  /enrollments/{enrollmentId}/steps/{stepId}/submit:
    post:
      operationId: submitStep
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/StepId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepSubmissionRequest"
      responses:
        "200":
          description: Submission, including quiz result when applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepSubmission"
  /submissions/{submissionId}/review:
    post:
      operationId: reviewSubmission
      x-implementation-status: implemented-phase11
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                reason:
                  type: string
      responses:
        "200":
          description: Reviewed submission and reconciled score.
  /enrollments/{enrollmentId}/steps/{stepId}/weigh-in:
    put:
      operationId: submitWeighIn
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/StepId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weightKilograms]
              properties:
                weightKilograms:
                  type: string
                  pattern: '^\d+(\.\d{1,2})?$'
      responses:
        "200":
          description: >
            Step-scoped initial, daily, or final weigh-in and reconciled score.
            Daily weigh-ins are progress records and do not add weight points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighIn"
  /enrollments/{enrollmentId}/weigh-ins/{weighInId}:
    patch:
      operationId: correctWeighIn
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - name: weighInId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weightKilograms, reason]
              properties:
                weightKilograms:
                  type: string
                  pattern: '^\d+(\.\d{1,2})?$'
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Admin-corrected weigh-in, audit event, and score.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighIn"
  /enrollments/{enrollmentId}/steps/{stepId}/quiz/reopen:
    post:
      operationId: reopenQuizAttempt
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/StepId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Previous attempt retained and one new sequence opened.
  /participants/{participantId}/coach:
    put:
      operationId: transferParticipantCoach
      x-implementation-status: implemented-phase11
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coachId, reason]
              properties:
                coachId: { type: string, format: uuid }
                reason: { type: string, minLength: 1 }
      responses:
        "204":
          description: Active and scheduled enrollments transferred.
  /programs/{programId}/winners/lock:
    post:
      operationId: lockProgramWinners
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Immutable top-five snapshot.
  /programs/{programId}/winner-posters:
    post:
      operationId: publishWinnerPoster
      x-implementation-status: implemented-phase11
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winnerSnapshotId, mediaToken, title]
              properties:
                winnerSnapshotId: { type: string, format: uuid }
                mediaToken: { type: string }
                title: { type: string, minLength: 1 }
      responses:
        "201":
          description: Published poster tied to one winner snapshot.
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: apikey
      description: >
        Public application credential. It does not create an Auth identity
        and requests execute as the Postgres anon role.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StepId:
      name: stepId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    DomainError:
      description: Stable actionable domain error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DomainError"
  schemas:
    CoachApplicationDraftInput:
      type: object
      additionalProperties: false
      required:
        - memberLevel
        - hasCompletedHomSts
        - hasCompletedIct
        - termsVersion
      properties:
        memberLevel:
          type: string
          enum:
            - member
            - sc
            - sb
            - supervisor
            - world_team
            - tab_team
            - get_team
            - millionaire_team
            - presidents_team
        hasCompletedHomSts: { type: boolean }
        hasCompletedIct: { type: boolean }
        termsVersion: { type: string, minLength: 1 }
    CoachApplication:
      type: object
      additionalProperties: false
      required:
        - id
        - applicantUserId
        - displayNameSnapshot
        - phoneNumberSnapshot
        - memberLevelSnapshot
        - hasCompletedHomSts
        - hasCompletedIct
        - termsVersion
        - status
        - paymentState
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        applicantUserId: { type: string, format: uuid }
        displayNameSnapshot: { type: string }
        phoneNumberSnapshot: { type: string }
        memberLevelSnapshot: { type: string }
        hasCompletedHomSts: { type: boolean }
        hasCompletedIct: { type: boolean }
        termsVersion: { type: string }
        status:
          type: string
          enum:
            - draft
            - ineligible
            - ready_for_payment
            - payment_processing
            - payment_verified
            - pending_admin_approval
            - approved
            - rejected
            - expired
        paymentState:
          type: [string, "null"]
          enum: [null, not_started, processing, pending, verified, failed, cancelled, refunded]
        submittedAt: { type: [string, "null"], format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthenticatedProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - publicProfileId
        - role
        - displayName
        - city
        - onboardingStatus
        - accountPurpose
      properties:
        userId: { type: string, format: uuid }
        publicProfileId:
          type: string
          format: uuid
          description: Stable identifier used on public projections.
        role: { type: string, enum: [participant, coach, admin] }
        displayName: { type: string }
        city: { type: string }
        phoneNumber: { type: [string, "null"] }
        currentCoachId: { type: [string, "null"], format: uuid }
        avatarUrl: { type: [string, "null"], format: uri }
        memberLevel:
          type: [string, "null"]
          enum:
            - null
            - member
            - sc
            - sb
            - supervisor
            - world_team
            - tab_team
            - get_team
            - millionaire_team
            - presidents_team
        onboardingStatus:
          type: string
          enum:
            - provisional
            - coach_handoff_pending
            - active
            - cleanup_pending
        accountPurpose:
          type: string
          enum: [participant, coach_applicant]
    AssignedCoach:
      type: object
      additionalProperties: false
      required:
        - userId
        - publicProfileId
        - displayName
        - city
        - isPublic
        - isApproved
      properties:
        userId: { type: string, format: uuid }
        publicProfileId: { type: string, format: uuid }
        displayName: { type: string }
        city: { type: string }
        avatarUrl: { type: [string, "null"], format: uri }
        isPublic: { type: boolean }
        isApproved: { type: boolean }
    ProgramDayAccess:
      type: object
      additionalProperties: false
      required:
        - enrollmentId
        - programId
        - programDayId
        - dayNumber
        - access
        - isCurrentDay
      properties:
        enrollmentId: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        programDayId: { type: string, format: uuid }
        dayNumber: { type: integer, minimum: 1 }
        access:
          type: string
          enum: [hidden, locked, read_only, available]
        isCurrentDay: { type: boolean }
    AuthenticatedDashboardSummary:
      type: object
      additionalProperties: false
      required:
        - role
        - activeEnrollmentCount
        - completedEnrollmentCount
        - pendingSubmissionCount
        - assignedParticipantCount
      properties:
        role: { type: string, enum: [participant, coach, admin] }
        activeEnrollmentCount: { type: integer, minimum: 0 }
        completedEnrollmentCount: { type: integer, minimum: 0 }
        pendingSubmissionCount: { type: integer, minimum: 0 }
        assignedParticipantCount: { type: integer, minimum: 0 }
    PrivateScore:
      type: object
      additionalProperties: false
      required:
        - enrollmentId
        - activityPoints
        - quizPoints
        - weightPoints
        - adjustmentPoints
        - progressPercentage
      properties:
        enrollmentId: { type: string, format: uuid }
        activityPoints: { type: integer }
        quizPoints: { type: integer }
        weightPoints: { type: integer }
        adjustmentPoints: { type: integer }
        progressPercentage:
          { type: integer, minimum: 0, maximum: 100 }
        rank: { type: [integer, "null"], minimum: 1 }
    PublicCoach:
      type: object
      additionalProperties: false
      required: [id, displayName, biography, city]
      properties:
        id:
          type: string
          format: uuid
          description: Public profile identifier, never an Auth user ID.
        displayName: { type: string }
        biography: { type: string }
        city: { type: string }
        photoUrl: { type: [string, "null"], format: uri }
    PublicLeaderboardEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - programId
        - participantId
        - participantDisplayName
        - rank
        - progressPercentage
        - totalPoints
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        participantId:
          type: string
          format: uuid
          description: Public profile identifier, never an Auth user ID.
        participantDisplayName: { type: string }
        rank: { type: integer, minimum: 1 }
        progressPercentage:
          { type: integer, minimum: 0, maximum: 100 }
        totalPoints: { type: integer }
    PublicWinner:
      type: object
      additionalProperties: false
      required:
        - id
        - programId
        - participantId
        - rank
        - participantDisplayName
        - totalPoints
        - lockedAt
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        participantId:
          type: string
          format: uuid
          description: Public profile identifier, never an Auth user ID.
        rank: { type: integer, minimum: 1, maximum: 5 }
        participantDisplayName: { type: string }
        totalPoints: { type: integer }
        lockedAt: { type: string, format: date-time }
    PublicWinnerPoster:
      type: object
      additionalProperties: false
      required:
        - id
        - programId
        - winnerSnapshotId
        - title
        - alternativeText
        - mediaUrl
        - publishedAt
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        winnerSnapshotId: { type: string, format: uuid }
        title: { type: string }
        alternativeText: { type: string }
        mediaUrl: { type: string, format: uri }
        publishedAt: { type: string, format: date-time }
    Program:
      type: object
      required:
        - id
        - title
        - status
        - startsOn
        - endsOn
        - timezone
        - participantLimit
        - registrationClosesAt
        - scoring
        - commerce
        - days
      properties:
        id: { type: string, format: uuid }
        sourceProgramId: { type: [string, "null"], format: uuid }
        title: { type: string }
        summary: { type: string }
        coverImageUrl: { type: [string, "null"], format: uri }
        coverAlternativeText: { type: [string, "null"] }
        status:
          type: string
          enum:
            - draft
            - preparing_commerce
            - scheduled
            - active
            - completed
            - archived
        pace: { type: string, enum: [scheduled, self_paced] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        timezone: { type: string }
        participantLimit: { type: [integer, "null"], minimum: 1 }
        registrationClosesAt:
          type: [string, "null"]
          format: date-time
          description: >
            Exact instant at which Participant self-enrollment closes.
            Null means there is no additional registration cutoff.
        pastStepPolicy:
          type: string
          enum: [available, read_only, hidden]
        futureStepPolicy:
          type: string
          enum: [available, locked, hidden]
        scoring:
          $ref: "#/components/schemas/ScoringConfiguration"
        commerce:
          $ref: "#/components/schemas/CommerceConfiguration"
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDay"
    ScoringConfiguration:
      type: object
      required:
        - pointsPerActivity
        - pointsPerWeightLossKilogram
        - quizPassingPercentage
      properties:
        pointsPerActivity: { type: integer, minimum: 0 }
        pointsPerWeightLossKilogram: { type: string }
        quizPassingPercentage:
          { type: integer, minimum: 0, maximum: 100 }
    CommerceConfiguration:
      type: object
      required: [pricingMode, platformAvailability]
      properties:
        pricingMode: { type: string, enum: [free, paid] }
        desiredPrice: { type: [string, "null"] }
        platformAvailability:
          type: array
          items:
            type: object
            required: [platform, provisioningStatus]
            properties:
              platform: { type: string, enum: [app_store, play_store] }
              provisioningStatus:
                type: string
                enum:
                  - not_required
                  - not_requested
                  - provisioning
                  - waiting_for_store
                  - ready
                  - action_required
                  - retired
              productId: { type: [string, "null"] }
              displayPrice: { type: [string, "null"] }
    ProgramDay:
      type: object
      required: [id, dayNumber, scheduledOn, steps]
      properties:
        id: { type: string, format: uuid }
        dayNumber: { type: integer, minimum: 1 }
        scheduledOn: { type: string, format: date }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ProgramStep"
    ProgramStep:
      type: object
      required: [id, order, title, content]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        title: { type: string }
        instructions: { type: string }
        content:
          $ref: "#/components/schemas/StepContent"
    StepContent:
      type: object
      required: [kind, completionPolicy, questions]
      properties:
        kind:
          type: string
          enum:
            - article
            - video
            - form
            - quiz
            - initial_weigh_in
            - daily_weigh_in
            - final_weigh_in
        completionPolicy:
          type: string
          enum:
            - mark_complete
            - answer_all_questions
            - watch_video
            - automatic_quiz
            - submit_weigh_in
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    Question:
      type: object
      required: [id, order, kind, prompt, options]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        kind:
          type: string
          enum:
            - short_answer
            - long_answer
            - number
            - single_choice
            - multiple_choice
            - image_choice
            - photo_upload
            - heading
            - text
        prompt: { type: string }
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
    QuestionOption:
      type: object
      required: [id, order, title]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        title: { type: string }
        mediaUrl: { type: [string, "null"], format: uri }
        mediaAlternativeText: { type: [string, "null"] }
    DuplicateProgramRequest:
      type: object
      required: [title, startDate]
      properties:
        title: { type: string, minLength: 1 }
        startDate: { type: string, format: date }
        endDate: { type: [string, "null"], format: date }
    EnrollmentContext:
      type: object
      required: [enrollment, program, submissions, weighIns]
      properties:
        enrollment:
          $ref: "#/components/schemas/Enrollment"
        program:
          $ref: "#/components/schemas/Program"
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/StepSubmission"
        weighIns:
          type: array
          items:
            $ref: "#/components/schemas/WeighIn"
    WeighIn:
      type: object
      required:
        - id
        - enrollmentId
        - stepId
        - kind
        - weightKilograms
        - recordedAt
      properties:
        id: { type: string, format: uuid }
        enrollmentId: { type: string, format: uuid }
        stepId: { type: [string, "null"], format: uuid }
        kind:
          type: string
          enum: [initial, daily, final]
        weightKilograms:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        recordedAt: { type: string, format: date-time }
    Enrollment:
      type: object
      required: [id, programId, participantId, coachId, status]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        participantId: { type: string, format: uuid }
        coachId: { type: string, format: uuid }
        status:
          type: string
          enum:
            - initiated
            - waiting_for_payment
            - active
            - completed
            - cancelled
            - refunded
    StepSubmissionRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionAnswer"
        watchedPercentage: { type: [integer, "null"], minimum: 0, maximum: 100 }
    SubmissionAnswer:
      type: object
      required: [questionId]
      properties:
        questionId: { type: string, format: uuid }
        textValue: { type: [string, "null"] }
        numberValue: { type: [string, "null"] }
        selectedOptionIds:
          type: array
          items: { type: string, format: uuid }
        uploadedPhotoToken: { type: [string, "null"] }
    StepSubmission:
      type: object
      required: [id, enrollmentId, stepId, status, answers]
      properties:
        id: { type: string, format: uuid }
        enrollmentId: { type: string, format: uuid }
        stepId: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        answers:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionAnswer"
        quizResult:
          type: [object, "null"]
          properties:
            correctCount: { type: integer }
            totalCount: { type: integer }
            percentage: { type: integer }
            passed: { type: boolean }
            awardedPoints: { type: integer }
    PurchaseIntentPreflight:
      type: object
      additionalProperties: false
      required:
        - purchaseIntentId
        - subjectKind
        - productId
        - appAccountToken
        - environment
        - expiresAt
        - status
      properties:
        purchaseIntentId: { type: string, format: uuid }
        subjectKind:
          $ref: "#/components/schemas/CommerceSubjectKind"
        productId: { type: string }
        appAccountToken: { type: string, format: uuid }
        environment:
          $ref: "#/components/schemas/CommerceEnvironment"
        expiresAt: { type: string, format: date-time }
        status:
          type: string
          enum: [reserved, purchase_pending, fulfilled, cancelled, expired, failed]
        presentation:
          type: object
          description: Non-authoritative display metadata; price comes from StoreKit.
          additionalProperties: false
          properties:
            programTitle: { type: [string, "null"] }
            coachDisplayName: { type: [string, "null"] }
            durationMonths: { type: [integer, "null"], enum: [3, null] }
    ApplePurchaseVerificationRequest:
      type: object
      additionalProperties: false
      required: [purchaseIntentId, signedTransaction]
      properties:
        purchaseIntentId: { type: string, format: uuid }
        signedTransaction: { type: string, minLength: 1, writeOnly: true }
    AppleRestoreRequest:
      type: object
      additionalProperties: false
      required: [transactions]
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [signedTransaction]
            properties:
              purchaseIntentId: { type: [string, "null"], format: uuid }
              signedTransaction: { type: string, minLength: 1, writeOnly: true }
    CommerceEnvironment:
      type: string
      enum: [xcode, local_testing, sandbox, production]
    CommerceSubjectKind:
      type: string
      enum: [program, coach_access]
    CommerceProductType:
      type: string
      enum: [non_consumable, non_renewing_subscription]
    CommerceTransaction:
      type: object
      additionalProperties: false
      required:
        - id
        - subjectKind
        - provider
        - environment
        - productId
        - productType
        - status
      properties:
        id: { type: string, format: uuid }
        subjectKind:
          $ref: "#/components/schemas/CommerceSubjectKind"
        programId: { type: [string, "null"], format: uuid }
        coachApplicationId: { type: [string, "null"], format: uuid }
        provider: { type: string, enum: [app_store, play_store] }
        environment:
          $ref: "#/components/schemas/CommerceEnvironment"
        productId: { type: string }
        productType:
          $ref: "#/components/schemas/CommerceProductType"
        status:
          type: string
          enum: [pending, verified, refunded, revoked, expired]
        purchasedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revocationAt: { type: [string, "null"], format: date-time }
        currencyCode: { type: [string, "null"] }
        priceMilliunits:
          type: [integer, "null"]
          minimum: 0
          description: Store-reported price in thousandths of a currency unit.
    CommerceFulfillment:
      type: object
      additionalProperties: false
      required: [transactionId, subjectKind, status, idempotent]
      properties:
        transactionId: { type: string, format: uuid }
        subjectKind:
          $ref: "#/components/schemas/CommerceSubjectKind"
        status:
          type: string
          enum: [verified, refunded, revoked, expired]
        programId: { type: [string, "null"], format: uuid }
        enrollmentId: { type: [string, "null"], format: uuid }
        programEntitlementId: { type: [string, "null"], format: uuid }
        coachApplicationId: { type: [string, "null"], format: uuid }
        coachEntitlementId: { type: [string, "null"], format: uuid }
        coachAccessStartsAt: { type: [string, "null"], format: date-time }
        coachAccessEndsAt: { type: [string, "null"], format: date-time }
        idempotent: { type: boolean }
    Entitlement:
      type: object
      required: [id, programId, participantId, status]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        participantId: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked, refunded] }
    DomainError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - validation_failed
            - permission_denied
            - not_found
            - conflict
            - coach_qr_invalid
            - coach_mismatch
            - program_unavailable
            - program_full
            - registration_closed
            - reason_required
            - participant_invalid
            - coach_required
            - coach_invalid
            - payment_required
            - payment_pending
            - purchase_unverified
            - product_not_ready
            - purchase_intent_expired
            - reservation_conflict
            - transaction_replayed
            - transaction_mismatch
            - fulfillment_failed
            - refunded
            - revoked
            - authentication_required
            - rate_limited
            - request_invalid
            - idempotency_key_invalid
            - already_enrolled
            - payment_not_required
            - coach_approval_required
            - coach_eligibility_incomplete
            - profile_incomplete
            - commerce_operation_failed
            - unknown
            - quiz_attempt_used
            - recent_reauthentication_required
            - admin_account_deletion_not_allowed
            - account_relationships_require_transfer
            - private_media_cleanup_failed
            - account_deletion_failed
        message: { type: string }
        field: { type: [string, "null"] }
