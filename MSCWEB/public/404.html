<!doctype html>
<html lang="id-ID">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halaman tidak ditemukan</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #f7f7f8; color: #111; }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      h1 { font-size: 2rem; line-height: 1.2; }
      p { color: #5f6368; line-height: 1.5; }
      a { color: #b42318; font-weight: 700; }
      @media (prefers-color-scheme: dark) { body { background: #0d0d0f; color: #f5f5f5; } p { color: #b0b0b5; } a { color: #f5c542; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Halaman tidak ditemukan</h1>
      <p>Periksa alamat halaman atau kembali ke beranda.</p>
      <a href="/">Kembali ke beranda</a>
    </main>
  </body>
</html>
