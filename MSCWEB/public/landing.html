<!doctype html>
<html lang="id-ID">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#111111" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D0F" />
    <meta
      name="description"
      content="Ikuti program MSC Body Transformation dengan langkah yang jelas dan dukungan Coach."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <title>MSC Body Transformation</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f8;
        color: #111;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(100% - 2rem, 45rem); padding-block: 3rem; }
      h1 { margin: 0; max-width: 12ch; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.02; letter-spacing: -0.04em; }
      p { max-width: 38rem; margin: 1.5rem 0; color: #5f6368; font-size: 1.2rem; line-height: 1.55; }
      a { display: inline-flex; min-height: 3.125rem; align-items: center; justify-content: center; border-radius: 0.75rem; padding-inline: 1.5rem; background: #d92d20; color: #fff; font-weight: 700; text-decoration: none; }
      a:hover { background: #b42318; }
      a:focus-visible { outline: 3px solid #2457a6; outline-offset: 3px; }
      aside { margin-top: 2rem; border: 1px solid #dadce0; border-radius: 1rem; padding: 1.5rem; background: #fff; }
      aside h2 { margin: 0; font-size: 1.125rem; }
      aside p { margin: 0.5rem 0 0; font-size: 1rem; }
      @media (prefers-color-scheme: dark) {
        :root { background: #0d0d0f; color: #f5f5f5; }
        p { color: #b0b0b5; }
        aside { background: #1c1c1e; border-color: #3a3a3c; }
        a:focus-visible { outline-color: #78a9ff; }
      }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <h1>MSC Body Transformation</h1>
      <p>Ikuti program transformasi dengan langkah yang jelas, dukungan Coach, dan progres yang mudah dipantau.</p>
      <a href="/app">Buka aplikasi</a>
      <aside>
        <h2>Fondasi PWA</h2>
        <p>Landing publik ini dapat dibaca tanpa JavaScript dan dipisahkan dari bundle aplikasi.</p>
      </aside>
    </main>
  </body>
</html>
